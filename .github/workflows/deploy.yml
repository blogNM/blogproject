# main에 app/ 변경이 들어오면 테스트 → 도커 이미지 만들기 → 서버에 SSH로 올려 실행한다.
# Actions 탭에서 [Run workflow]로 직접 돌릴 수도 있다.
#
# 시크릿 (Settings → Secrets and variables → Actions → Repository secrets)
#   꼭: SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD, DB_ADDRESS, DB_PORT, DB_NAME, DB_PASSWORD
#   DB_USERNAME: 없으면 SSH_ID를 DB 아이디로 쓴다
#   선택: MAIL_USERNAME, MAIL_PASSWORD, ADMIN_INITIAL_LOGIN_ID, ADMIN_INITIAL_PASSWORD,
#         TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY
# 변수 (같은 화면의 Variables 탭)
#   APP_PORT: 도커 컨테이너를 열 서버 포트. 없으면 8340 (학교 서버에서 받은 8340~8349의 첫 번호)
#   APP_BASE_URL (사이트 주소. 없으면 http://SSH_ADDRESS:APP_PORT)
name: 배포

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 자동 테스트
        run: ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test

  deploy:
    name: 이미지 만들고 서버에 배포
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || '8340' }}
    steps:
      - uses: actions/checkout@v4
      - name: 포트 번호 확인
        run: |
          case "$APP_PORT" in
            ''|*[!0-9]*) echo "::error::APP_PORT 변수를 숫자로 넣어 주세요 (Settings → Secrets and variables → Actions → Variables)"; exit 1 ;;
          esac
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: jar 만들기
        working-directory: app
        run: ./gradlew bootJar -x test --no-daemon
      - name: 도커 이미지 만들기
        run: |
          docker build -t creat-blog:latest -t creat-blog:${GITHUB_SHA::7} app
          mkdir -p out
          docker save creat-blog:latest | gzip > out/creat-blog.tar.gz
          cp app/deploy/deploy.sh out/
          ls -lh out
      - name: 서버로 파일 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: out/creat-blog.tar.gz,out/deploy.sh
          target: creat-blog/incoming
          strip_components: 1
      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || secrets.SSH_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL || format('http://{0}:{1}', secrets.SSH_ADDRESS, vars.APP_PORT || secrets.APP_PORT || '8340') }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_INITIAL_LOGIN_ID: ${{ secrets.ADMIN_INITIAL_LOGIN_ID }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          envs: APP_PORT,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,APP_BASE_URL,MAIL_USERNAME,MAIL_PASSWORD,ADMIN_INITIAL_LOGIN_ID,ADMIN_INITIAL_PASSWORD,TURNSTILE_SITE_KEY,TURNSTILE_SECRET_KEY
          script: bash creat-blog/incoming/deploy.sh creat-blog/incoming/creat-blog.tar.gz
