# main에 app/ 변경이 들어오면 테스트 → 도커 이미지 만들기 → 서버에 SSH로 올려 실행한다.
# Actions 탭에서 [Run workflow]로 직접 돌릴 수도 있다.
#
# 시크릿 (Settings → Secrets and variables → Actions → Repository secrets)
#   꼭: SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD, DB_ADDRESS, DB_PORT, DB_NAME, DB_PASSWORD
#   DB_USERNAME: 없으면 SSH_ID를 DB 아이디로 쓴다
#   선택: MAIL_USERNAME, MAIL_PASSWORD, ADMIN_INITIAL_LOGIN_ID, ADMIN_INITIAL_PASSWORD,
#         RECAPTCHA_SITE_KEY, RECAPTCHA_SECRET_KEY (로봇 확인 Google reCAPTCHA v2, D-118.
#         RECAPTCHA_ID·RECAPTCHA_KEY·RECAPTCHA_CLIENT_ID·RECAPTCHA_SITEKEY, RECAPTCHA_PASSWORD·RECAPTCHA_SECRET·
#         RECAPTCHA_CLIENT_SECRET·RECAPTCHA_PW 이름으로 넣어도 읽음. 앞이 RECAPTCHAR_인 같은 이름도 읽음),
#         GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (구글 로그인, D-103. 없으면 구글 버튼을 숨김.
#         GG_CLIENT_ID, GG_CLIENT_PASSWORD 이름으로 넣어도 읽음)
#         NAVER_CLIENT_ID, NAVER_CLIENT_SECRET (네이버 로그인, D-107. 없으면 네이버 버튼을 숨김.
#         NAVER_ID·NV_CLIENT_ID, NAVER_SECRET·NV_CLIENT_PASSWORD·NAVER_CLIENT_PASSWORD 이름으로 넣어도 읽음)
#         KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET (카카오 로그인, D-108. 없으면 카카오 버튼을 숨김.
#         KAKAO_REST_API_KEY·KAKAO_ID, KAKAO_SECRET 이름으로 넣어도 읽음)
# 변수 (같은 화면의 Variables 탭)
#   APP_PORT: 학교 Nginx가 보내는 포트. 없으면 8340 (학교 서버에서 받은 8340~8349의 첫 번호).
#             여기에는 우리 Nginx(creat-blog-lb)가 듣고, 앱 두 대로 나눈다 (서버 두 대·롤링 무중단 배포, D-111)
#   APP_PORT_A, APP_PORT_B: 앱 두 대(creat-blog-a·creat-blog-b)의 포트. 없으면 APP_PORT+1 (8341), APP_PORT+2 (8342).
#             새벽 정리 작업은 a만 돌린다. 처음 한 번은 빈 포트 APP_PORT+9 (8349)에서 우리 Nginx를 시험한다
#   APP_DOMAIN: 학교 Nginx가 받을 도메인. 없으면 creat.java21.net. 배포 때 ~/nginx/<도메인>.conf 를 만든다
#   APP_BASE_URL (사이트 주소. 없으면 http://APP_DOMAIN, Nginx 설정에 인증서가 있으면 https://APP_DOMAIN)
name: 배포

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      reset_db:
        description: 'DB의 테이블을 모두 지우고 새로 만들기 (되돌릴 수 없음). 지우려면 reset 이라고 적기'
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 자동 테스트
        run: ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test

  deploy:
    name: 이미지 만들고 서버에 배포
    needs: test
    runs-on: ubuntu-latest
    env:
      APP_PORT: ${{ vars.APP_PORT || secrets.APP_PORT || '8340' }}
      # 비어 있으면 deploy.sh가 APP_PORT+1, APP_PORT+2로 정한다 (D-111)
      APP_PORT_A: ${{ vars.APP_PORT_A || '' }}
      APP_PORT_B: ${{ vars.APP_PORT_B || '' }}
    steps:
      - uses: actions/checkout@v4
      - name: 포트 번호 확인
        run: |
          case "$APP_PORT" in
            ''|*[!0-9]*) echo "::error::APP_PORT 변수를 숫자로 넣어 주세요 (Settings → Secrets and variables → Actions → Variables)"; exit 1 ;;
          esac
          for v in APP_PORT_A APP_PORT_B; do
            case "${!v}" in
              *[!0-9]*) echo "::error::$v 변수는 비우거나 숫자로 넣어 주세요"; exit 1 ;;
            esac
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: jar 만들기
        working-directory: app
        run: ./gradlew bootJar -x test --no-daemon
      - name: 도커 이미지 만들기
        run: |
          docker build -t creat-blog:latest -t creat-blog:${GITHUB_SHA::7} app
          mkdir -p out
          docker save creat-blog:latest | gzip > out/creat-blog.tar.gz
          cp app/deploy/deploy.sh out/
          ls -lh out
      - name: 서버로 파일 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: out/creat-blog.tar.gz,out/deploy.sh
          target: creat-blog/incoming
          strip_components: 1
      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || secrets.SSH_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RESET_DB: ${{ github.event.inputs.reset_db }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN || 'creat.java21.net' }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          ADMIN_INITIAL_LOGIN_ID: ${{ secrets.ADMIN_INITIAL_LOGIN_ID }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY || secrets.RECAPTCHA_ID || secrets.RECAPTCHA_KEY || secrets.RECAPTCHA_CLIENT_ID || secrets.RECAPTCHA_SITEKEY || secrets.RECAPTCHAR_SITE_KEY || secrets.RECAPTCHAR_ID || secrets.RECAPTCHAR_KEY || secrets.RECAPTCHAR_CLIENT_ID || secrets.RECAPTCHAR_SITEKEY }}
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY || secrets.RECAPTCHA_PASSWORD || secrets.RECAPTCHA_SECRET || secrets.RECAPTCHA_CLIENT_SECRET || secrets.RECAPTCHA_PW || secrets.RECAPTCHAR_SECRET_KEY || secrets.RECAPTCHAR_PASSWORD || secrets.RECAPTCHAR_SECRET || secrets.RECAPTCHAR_CLIENT_SECRET || secrets.RECAPTCHAR_PW }}
          # 저장소에 GG_CLIENT_ID·GG_CLIENT_PASSWORD 이름으로 넣어 두어 그 이름도 읽는다
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.GG_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.GG_CLIENT_PASSWORD }}
          # 네이버 로그인 (D-107). 시크릿 이름이 정해지지 않아 흔히 쓰는 이름을 차례로 읽는다
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID || secrets.NAVER_ID || secrets.NV_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET || secrets.NAVER_SECRET || secrets.NV_CLIENT_PASSWORD || secrets.NAVER_CLIENT_PASSWORD }}
          # 카카오 로그인 (D-108). Client ID는 카카오 앱의 REST API 키
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID || secrets.KAKAO_REST_API_KEY || secrets.KAKAO_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET || secrets.KAKAO_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          # 앱 두 대를 한 대씩 바꾸고 기다리므로 한 대일 때보다 오래 걸린다 (보통 2분 안쪽)
          command_timeout: 15m
          envs: APP_PORT,APP_PORT_A,APP_PORT_B,APP_DOMAIN,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,RESET_DB,APP_BASE_URL,MAIL_USERNAME,MAIL_PASSWORD,ADMIN_INITIAL_LOGIN_ID,ADMIN_INITIAL_PASSWORD,RECAPTCHA_SITE_KEY,RECAPTCHA_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET
          script: bash creat-blog/incoming/deploy.sh creat-blog/incoming/creat-blog.tar.gz
