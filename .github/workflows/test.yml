# PR마다 자동 테스트를 돌린다. 테스트가 깨진 변경이 main에 합쳐진 뒤에야 배포에서 실패하지 않게,
# 합치기 전에 PR 화면에서 결과를 본다. (Settings → Branches에서 이 검사를 "필수"로 지정하면 실패한 PR은 합칠 수 없다)
name: 테스트

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/test.yml'

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: blog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 자동 테스트
        run: ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test
