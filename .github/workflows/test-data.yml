# 실제 사이트(서버)에 테스트 회원 8명과 그 활동을 넣거나, 테스트 데이터만 모두 지운다 (D-113).
# Actions 탭 → 테스트 데이터 → Run workflow 에서 load(넣기) 또는 remove(지우기)를 고른다.
#
# 서버에서 하는 일: 지금 돌고 있는 이미지(creat-blog:latest)로 컨테이너를 하나 더 잠깐 띄워 넣기·지우기만 하고 끝낸다.
# 운영 중인 앱 두 대(creat-blog-a·b)는 건드리지 않는다. 사진은 같은 업로드 폴더(~/creat-blog/data/uploads)에 들어간다.
# 하기 전에 DB를 ~/creat-blog/backups/ 에 백업한다.
#
# 시크릿: 배포와 같은 SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD, DB_ADDRESS, DB_PORT, DB_NAME, DB_PASSWORD, (DB_USERNAME)
#   TEST_MEMBER_PASSWORD: 테스트 회원 8명의 비밀번호 (8~15자, 영문·숫자·특수문자). 넣기(load)에 꼭 필요하다.
#                         이미 넣은 뒤 값을 바꾸고 다시 load를 돌리면 비밀번호만 새 값으로 바뀐다.
name: 테스트 데이터

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'load: 테스트 데이터 넣기 (다시 눌러도 더 생기지 않음) / remove: 테스트 데이터만 모두 지우기'
        required: true
        type: choice
        options:
          - load
          - remove
        default: load
      confirm:
        description: 'remove를 골랐으면 여기에도 remove 라고 적기 (실수로 지우지 않게)'
        required: false
        default: ''

# 배포와 겹치지 않게 같은 줄에 선다
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-data:
    name: 테스트 데이터 ${{ inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: 고른 값 확인
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          HAS_PASSWORD: ${{ secrets.TEST_MEMBER_PASSWORD != '' }}
        run: |
          if [ "$ACTION" = "remove" ] && [ "$CONFIRM" != "remove" ]; then
            echo "::error::지우려면 confirm 칸에 remove 라고 적어 주세요."; exit 1
          fi
          if [ "$ACTION" = "load" ] && [ "$HAS_PASSWORD" != "true" ]; then
            echo "::error::TEST_MEMBER_PASSWORD 시크릿을 먼저 넣어 주세요 (Settings → Secrets and variables → Actions)."; exit 1
          fi

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          ACTION: ${{ inputs.action }}
          TEST_MEMBER_PASSWORD: ${{ secrets.TEST_MEMBER_PASSWORD }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME || secrets.SSH_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 25m
          envs: ACTION,TEST_MEMBER_PASSWORD,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD
          script: |
            set -u
            APP_HOME="$HOME/creat-blog"
            NAME=creat-blog-test-data
            IMAGE=creat-blog:latest
            STAMP="$(date +%Y%m%d-%H%M%S)"
            if [ ! -s "$APP_HOME/runtime.env" ] || [ ! -s "$APP_HOME/secrets.env" ]; then
              echo "서버에 $APP_HOME/runtime.env 가 없습니다. 먼저 배포 워크플로를 돌려 주세요."; exit 1
            fi
            if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
              echo "$IMAGE 이미지가 없습니다. 먼저 배포 워크플로를 돌려 주세요."; exit 1
            fi
            # 지금 서버 이미지에 이 기능이 들어 있는지 (main에 합쳐 배포한 뒤에만 쓸 수 있다)
            if ! docker run --rm --entrypoint sh "$IMAGE" -c 'grep -q "testdata/TestDataRunner" /app/app.jar'; then
              echo "서버 이미지가 테스트 데이터 기능 전 버전입니다. 이 변경을 main에 합쳐 배포한 뒤 다시 돌려 주세요."; exit 1
            fi

            echo "== DB 백업"
            mkdir -p "$APP_HOME/backups"
            BACKUP="$APP_HOME/backups/before-test-data-$ACTION-$STAMP.sql.gz"
            if docker run --rm --network host -e MYSQL_PWD="$DB_PASSWORD" mysql:8.0 \
                 mysqldump -h"$DB_ADDRESS" -P"$DB_PORT" -u"$DB_USERNAME" --protocol=TCP --single-transaction \
                 --no-tablespaces --set-gtid-purged=OFF "$DB_NAME" | gzip > "$BACKUP" && [ -s "$BACKUP" ]; then
              chmod 600 "$BACKUP"; echo "백업: $BACKUP ($(du -h "$BACKUP" | cut -f1))"
            else
              rm -f "$BACKUP"
              if [ "$ACTION" = "remove" ]; then echo "DB를 백업하지 못해 지우지 않고 멈춥니다."; exit 1; fi
              echo "경고: DB를 백업하지 못했습니다. 넣기는 지우는 일이 없어 계속합니다."
            fi

            echo "== 테스트 데이터 $ACTION"
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            LOG="$(mktemp)"
            # 웹 서버는 이 서버 안의 빈 포트(0번 = 아무 빈 포트)에만 잠깐 뜨고, 일을 마치면 앱이 스스로 끝난다
            timeout 1200 docker run --name "$NAME" --network host \
              --env-file "$APP_HOME/secrets.env" --env-file "$APP_HOME/runtime.env" \
              -e TEST_DATA_ACTION="$ACTION" -e TEST_MEMBER_PASSWORD \
              -e SERVER_PORT=0 -e SERVER_ADDRESS=127.0.0.1 -e INSTANCE_ID=test-data -e APP_JOBS_ENABLED=false \
              -e JAVA_OPTS="-Xms128m -Xmx384m" \
              -v "$APP_HOME/data/uploads:/app/data/uploads" --user "$(id -u):$(id -g)" \
              "$IMAGE" > "$LOG" 2>&1
            code=$?
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            grep -E "TEST_DATA|ERROR|미리보기" "$LOG" | cut -c1-600 || true
            if [ "$code" -ne 0 ]; then
              echo "실패 (종료 코드 $code). 마지막 로그:"; tail -n 40 "$LOG" | cut -c1-400
            fi
            rm -f "$LOG"
            exit "$code"
