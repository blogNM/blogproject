<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 - 메인블로그</title>
  <link rel="stylesheet" href="/css/common.css">
  <script type="module" src="/js/pages/blog.js"></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="container">
    <p id="error" class="notice" hidden></p>
    <article id="blog" class="card" hidden>
      <p id="status-badge" class="badge warn" hidden></p>
      <h1 id="blog-name"></h1>
      <p id="blog-address" class="muted"></p>
      <p id="blog-description" class="description"></p>
      <ul id="blog-tags" class="tags"></ul>
      <p id="blog-meta" class="muted"></p>
      <div id="actions" class="actions"></div>
      <p id="action-message" class="info" role="status"></p>
    </article>
    <section id="posts-section" class="card" hidden>
      <div class="posts-head">
        <h2 class="section-title">글</h2>
        <a id="write-link" class="button primary inline" hidden>글쓰기</a>
      </div>
      <div class="posts-layout">
        <nav id="categories" class="category-nav" aria-label="카테고리"></nav>
        <div class="posts-main">
          <p id="filter-label" class="filter-label" hidden></p>
          <ul id="notices" class="post-list notices"></ul>
          <ul id="post-list" class="post-list"></ul>
          <div class="list-foot">
            <label class="inline-label" for="page-size">한 번에 보기</label>
            <select id="page-size">
              <option value="10">10개</option>
              <option value="20">20개</option>
              <option value="30">30개</option>
            </select>
          </div>
          <div id="post-pager" class="pager"></div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
