<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - 메인블로그</title>
  <link rel="stylesheet" href="/css/common.css">
  <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
  <header class="site-header"></header>
  <main class="container">
    <section class="card narrow">
      <h1>로그인</h1>
      <p id="notice" class="notice" hidden></p>
      <form id="login-form" novalidate>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label class="checkbox"><input id="remember" type="checkbox"> 로그인 유지 (14일)</label>

        <div id="captcha" class="captcha" hidden></div>
        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="links"><a href="/signup.html">회원가입</a></p>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
