<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 만들기 - Creat_</title>
  <link rel="icon" href="/img/creat-mark.svg" type="image/svg+xml">
  <script src="/js/color-mode.js"></script>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/dark.css">
  <script type="module" src="/js/pages/blog-new.js"></script>
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/layout.js">
  <link rel="modulepreload" href="/js/notifications.js">
  <link rel="modulepreload" href="/js/visit.js">
</head>
<body>
  <header class="site-header"></header>
  <main class="container">
    <section class="card narrow create-card">
      <h1>블로그 만들기</h1>
      <form id="blog-form" novalidate>
        <label for="name">블로그 이름</label>
        <input id="name" maxlength="30" required>
        <p class="hint">1~30자. 다른 블로그와 같은 이름도 됩니다.</p>

        <label for="slug">블로그 주소</label>
        <div class="row">
          <span class="prefix">/blog/</span>
          <input id="slug" maxlength="30" autocapitalize="off" spellcheck="false" required>
          <button id="check-slug" type="button">확인</button>
        </div>
        <p id="slug-message" class="hint">영문 소문자·숫자·-로 3~30자. 만든 뒤에는 바꿀 수 없습니다.</p>

        <label for="description">소개 (선택)</label>
        <textarea id="description" maxlength="200" rows="3"></textarea>

        <label for="tags">태그 (선택, 쉼표로 구분, 5개까지)</label>
        <input id="tags" placeholder="여행, 사진">

        <fieldset class="theme-picker">
          <legend>테마 틀</legend>
          <p class="hint">블로그 모양을 골라요. 색·글꼴·문구도 바꿀 수 있고, 나중에 블로그 관리에서 언제든 다시 꾸밀 수 있어요.</p>
          <div id="theme-cards" class="theme-cards theme-squares"></div>
          <p id="theme-summary" class="hint theme-summary" aria-live="polite"></p>
        </fieldset>

        <div class="theme-options">
          <div>
            <label>강조 색</label>
            <div id="swatches" class="swatches"></div>
            <div class="row color-row">
              <input id="accent" maxlength="7" aria-label="강조 색 #RRGGBB" placeholder="#7C0CB4">
              <input id="accent-picker" type="color" aria-label="색 고르기">
            </div>
          </div>
          <div>
            <label for="font">글꼴</label>
            <select id="font"></select>
          </div>
        </div>

        <label for="hero-title">머리 사진 위 큰 문구 (선택, 40자까지, 비우면 블로그 이름)</label>
        <input id="hero-title" maxlength="40">
        <label for="hero-subtitle">작은 문구 (선택, 100자까지, 비우면 블로그 소개)</label>
        <input id="hero-subtitle" maxlength="100">

        <label for="cover">머리 사진 (선택)</label>
        <input id="cover" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp">
        <p class="hint">블로그 머리에 들어갑니다. jpg·jpeg·png·gif·webp, 3MB까지. 가로로 긴 사진이 잘 어울려요.</p>

        <fieldset class="choices">
          <legend>공개 범위</legend>
          <label class="checkbox"><input type="radio" name="visibility" value="PUBLIC" checked> 공개: 목록·검색에 보입니다</label>
          <label class="checkbox"><input type="radio" name="visibility" value="LINK_ONLY"> 일부 공개: 공유 링크를 받은 사람만 봅니다</label>
          <label class="checkbox"><input type="radio" name="visibility" value="PRIVATE"> 비공개: 멤버만 봅니다</label>
        </fieldset>
        <fieldset class="choices">
          <legend>참여 방식</legend>
          <label class="checkbox"><input type="radio" name="joinPolicy" value="FREE" checked> 자유 참여: 신청하면 바로 멤버</label>
          <label class="checkbox"><input type="radio" name="joinPolicy" value="APPROVAL"> 승인제: 블로그장이 승인해야 멤버</label>
        </fieldset>
        <p class="hint">공개·일부 공개 블로그는 3개, 비공개는 5개까지 만들 수 있습니다.</p>
        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">만들기</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
