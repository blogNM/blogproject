<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 로그인 - Creat_</title>
  <link rel="icon" href="/img/creat-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin/login.js"></script>
</head>
<body class="adm">
  <header class="adm-bar">
    <a class="adm-brand" href="/admin/login.html"><span class="wordmark"><span class="word">Creat</span><span class="cursor" aria-hidden="true">_</span></span><span class="adm-brand-label">관리자</span></a>
  </header>
  <main class="adm-main">
    <section class="adm-card adm-narrow adm-login">
      <h1>관리자 로그인</h1>
      <p class="adm-sub">관리자 아이디로 들어옵니다.</p>
      <form id="login-form" novalidate>
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div id="captcha" class="captcha" hidden></div>
        <p id="error" class="adm-error" role="alert"></p>
        <button type="submit" class="primary">로그인</button>
      </form>
    </section>
  </main>
</body>
</html>
