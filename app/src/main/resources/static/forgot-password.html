<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 찾기 - Creat_</title>
  <link rel="icon" href="/img/creat-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <script type="module" src="/js/pages/forgot-password.js"></script>
  <link rel="modulepreload" href="/js/api.js">
  <link rel="modulepreload" href="/js/layout.js">
  <link rel="modulepreload" href="/js/notifications.js">
  <link rel="modulepreload" href="/js/visit.js">
</head>
<body>
  <header class="site-header"></header>
  <main class="container">
    <section class="card narrow">
      <h1>비밀번호 찾기</h1>
      <p class="muted">가입한 이메일로 6자리 인증번호를 보내 드립니다. 같은 화면에서 새 비밀번호를 정합니다.</p>

      <form id="step1" novalidate>
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="email" required>
        <p id="step1-error" class="error" role="alert"></p>
        <button type="submit" class="primary">인증번호 받기</button>
      </form>

      <form id="step2" novalidate hidden>
        <p id="sent-message" class="info"></p>
        <label for="code">인증번호 6자리</label>
        <div class="row">
          <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
          <button id="resend" type="button">다시 보내기</button>
        </div>
        <p class="hint">30분 안에 입력해 주세요. 5번 틀리면 다시 받아야 합니다.</p>

        <label for="password">새 비밀번호</label>
        <input id="password" type="password" autocomplete="new-password" maxlength="15">
        <p class="hint">8~15자, 영문·숫자·특수문자를 모두 넣어 주세요.</p>
        <label for="password2">새 비밀번호 확인</label>
        <input id="password2" type="password" autocomplete="new-password" maxlength="15">

        <p id="step2-error" class="error" role="alert"></p>
        <button type="submit" class="primary">비밀번호 바꾸기</button>
      </form>

      <div id="done" hidden>
        <p class="info">비밀번호를 바꿨습니다. 다른 기기의 로그인은 모두 풀렸습니다.</p>
        <a class="button primary" href="/login.html">로그인하기</a>
      </div>
      <p class="links"><a href="/find-email.html">이메일이 기억나지 않나요?</a></p>
    </section>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
