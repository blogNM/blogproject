<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 - Creat_</title>
  <link rel="icon" href="/img/creat-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/common.css">
  <script type="module" src="/js/pages/login.js"></script>

<body>
  <main class="auth-page">
    <div class="auth-split">
    <section class="auth-form">
      <a class="wordmark" href="/" aria-label="Creat_ 메인으로"><span class="word">Creat</span><span class="cursor" aria-hidden="true">_</span></a>
      <h1>반가워요!</h1>
      <p class="sub">다시 만나서 기뻐요. 로그인해 주세요.</p>
      <p id="notice" class="notice" hidden></p>
      <form id="login-form" novalidate>
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="name@email.com" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label class="checkbox"><input id="remember" type="checkbox"> 로그인 유지 (14일)</label>

        <div id="captcha" class="captcha" hidden></div>
        <p id="error" class="error" role="alert"></p>
        <button type="submit" class="primary">로그인</button>
      </form>
      <p class="or">또는</p>
      <a id="google-login" class="button wide-button google-button" href="/oauth2/authorization/google" hidden>
        <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
        구글로 로그인
      </a>
      <a class="button dark wide-button" href="/signup.html">새 계정 만들기</a>
      <div class="auth-links">
        <a href="/forgot-password.html">비밀번호를 잊었어요</a>
        <a href="/find-email.html">이메일 찾기</a>
      </div>
    </section>
