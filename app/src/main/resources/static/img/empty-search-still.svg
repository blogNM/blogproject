<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" role="img" aria-label="빈 카드 위를 이리저리 찾아다니는 돋보기">
<title>빈 카드 위를 이리저리 찾아다니는 돋보기</title>
<!-- 검색 결과가 없을 때 멈춘 그림 (D-105) -->
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A5BE0"/><stop offset=".55" stop-color="#7C0CB4"/><stop offset="1" stop-color="#5720C3"/></linearGradient>
  <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2D3C0"/><stop offset="1" stop-color="#C99B80"/></linearGradient>
  <radialGradient id="lens" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#E9DDF7" stop-opacity=".75"/></radialGradient>
</defs>
<ellipse cx="100" cy="156" rx="70" ry="7" fill="#39385B" opacity=".07"/>
<!-- 비어 있는 글 카드 세 장 -->
<g opacity=".9">
  <rect x="24" y="96" width="48" height="52" rx="9" fill="#fff" stroke="#E6E0EE" stroke-width="2"/>
  <rect x="32" y="106" width="32" height="5" rx="2.5" fill="#E6E0EE"/><rect x="32" y="116" width="24" height="5" rx="2.5" fill="#EFEAF5"/>
  <rect x="76" y="88" width="48" height="60" rx="9" fill="#fff" stroke="#E6E0EE" stroke-width="2"/>
  <rect x="84" y="98" width="32" height="5" rx="2.5" fill="#E6E0EE"/><rect x="84" y="108" width="24" height="5" rx="2.5" fill="#EFEAF5"/>
  <rect x="128" y="96" width="48" height="52" rx="9" fill="#fff" stroke="#E6E0EE" stroke-width="2"/>
  <rect x="136" y="106" width="32" height="5" rx="2.5" fill="#E6E0EE"/><rect x="136" y="116" width="24" height="5" rx="2.5" fill="#EFEAF5"/>
</g>
<!-- 이리저리 찾아다니는 돋보기 -->
<g>
  
  <g>
    
    <rect x="113" y="86" width="14" height="40" rx="7" fill="url(#peach)" transform="rotate(-40 120 96)"/>
    <circle cx="100" cy="72" r="26" fill="url(#lens)"/>
    <circle cx="100" cy="72" r="26" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <path d="M86,62 A16,16 0 0 1 98,54" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".9"/>
  </g>
</g>
<!-- 물음표 -->
<g fill="#C39496">
  <text x="164" y="44" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="middle">?</text>
  <text x="34" y="52" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#8A5BE0">?</text>
</g>
</svg>
