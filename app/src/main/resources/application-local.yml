# 내 컴퓨터에서 개발할 때: ./gradlew bootRun --args='--spring.profiles.active=local'
app:
  mail:
    mode: ${MAIL_MODE:log}
  auth:
    jwt-secret: ${JWT_SECRET:local-dev-only-jwt-secret-change-me-0123456789}
    code-hash-secret: ${CODE_HASH_SECRET:local-dev-only-code-secret}
    # http://localhost 에서도 쿠키가 붙도록
    cookie-secure: ${COOKIE_SECURE:false}
