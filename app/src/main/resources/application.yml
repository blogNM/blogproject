# 바뀔 수 있는 값은 모두 환경변수로 덮어쓸 수 있다 (헌법 VI, D-68).
spring:
  application:
    name: mainblog
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/blog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:blog}
    password: ${DB_PASSWORD:blog}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # 시각은 모두 한국 시간(app.time-zone) 그대로 저장한다. 서버 JVM 시간대(UTC 등)에 따라 값이 밀리지 않도록
      # LocalDateTime을 변환 없이 JDBC에 넘긴다. JdbcTemplate으로 읽고 쓰는 값과도 같아진다.
      hibernate.type.java_time_use_direct_jdbc: true
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  web:
    resources:
      cache:
        # 화면·js·css: 브라우저가 가지고 있다가 쓸 때마다 바뀌었는지 묻는다(304). /vendor·/img는 StaticCacheConfig (D-109)
        cachecontrol:
          no-cache: true

  servlet:
    multipart:
      # 사진 한 장 3MB, 한 번에 10MB (6.3)
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:3MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}

  # 컨테이너를 멈출 때(docker stop) 받던 요청(글 저장·사진 올리기)은 끝까지 처리하고 내려간다 (D-111).
  # deploy.sh가 SHUTDOWN_TIMEOUT=20s를 넘기고 docker stop은 30초 기다린다 (이 값보다 길어야 처리 중인 요청이 잘리지 않음)
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # 새 연결은 받지 않고(우리 Nginx가 다른 한 대로 보냄), 처리 중인 요청을 마친 뒤 내려간다 (D-111)
  shutdown: graceful
  # 화면·js·css·API 응답을 gzip으로 줄여 보낸다 (D-109). 글꼴(woff2)·사진은 이미 압축돼 있어 빼고, 1KB보다 작은 응답도 그대로 보낸다
  compression:
    enabled: ${SERVER_COMPRESSION:true}
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain
    min-response-size: 1KB

# 정적 파일을 브라우저에 둘 기간 (D-109, StaticCacheConfig). 글꼴·에디터와 그림
static-cache:
  vendor-max-age: ${STATIC_VENDOR_MAX_AGE:30d}
  image-max-age: ${STATIC_IMAGE_MAX_AGE:7d}

app:
  time-zone: Asia/Seoul
  # 서버 두 대 중 어느 것인지 (app-a, app-b). 응답 헤더 X-Instance와 /api/health에 보인다 (D-111)
  instance-id: ${INSTANCE_ID:}
  jobs:
    # 새벽 정리 작업(@Scheduled)을 이 서버에서 돌릴지. 두 대 중 app-a만 true (D-111). ShedLock이 있어 둘 다 켜져도 한 번만 돈다
    enabled: ${APP_JOBS_ENABLED:true}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # 깃허브 릴리스를 공지로 올릴 때 확인하는 값 (D-97). 서버의 secrets.env에서 만든다. 비어 있으면 그 주소를 닫는다.
  release-notice-token: ${RELEASE_NOTICE_TOKEN:}
  mail:
    # smtp: Gmail로 보냄, log: 메일을 보내지 않고 서버 콘솔에 찍음 (개발용)
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  auth:
    # JWT 서명 키. 운영에서는 32바이트 이상 임의 값을 반드시 환경변수로 준다.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: ${ACCESS_TOKEN_TTL:5m}
    remember-me-ttl: ${REMEMBER_ME_TTL:14d}
    # 로그인 유지를 안 했을 때 무활동 로그아웃 (D-61, D-62)
    idle-timeout: ${IDLE_TIMEOUT:30m}
    # 로그인 유지를 안 했을 때도 Refresh Token에 두는 최대 수명 (브라우저를 계속 켜 둔 경우)
    session-max-ttl: ${SESSION_MAX_TTL:1d}
    cookie-secure: ${COOKIE_SECURE:true}
    # 인증번호를 해시할 때 쓰는 비밀 키 (USR-02)
    code-hash-secret: ${CODE_HASH_SECRET:}
  social:
    # 구글 로그인 (D-103). Google Cloud 콘솔의 OAuth 클라이언트 값. 비워 두면 구글 버튼을 숨긴다.
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 네이버 로그인 (D-107). 네이버 개발자센터 → 내 애플리케이션의 Client ID·Secret. 비워 두면 네이버 버튼을 숨긴다.
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    # 카카오 로그인 (D-108). 카카오 개발자 콘솔 → 앱 → REST API 키와 그 키의 카카오 로그인 Client Secret. 비워 두면 카카오 버튼을 숨긴다.
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
  signup:
    code-ttl: ${SIGNUP_CODE_TTL:10m}
    # 인증을 마친 뒤 가입을 끝낼 때까지 기다리는 시간
    verified-ttl: ${SIGNUP_VERIFIED_TTL:30m}
    resend-interval: ${SIGNUP_RESEND_INTERVAL:1m}
    max-code-failures: ${SIGNUP_MAX_CODE_FAILURES:5}
  password-reset:
    # 비밀번호 재설정 인증번호: 30분, 1회용, 5번 틀리면 무효 (USR-06, SEC-05)
    code-ttl: ${PASSWORD_RESET_CODE_TTL:30m}
    max-code-failures: ${PASSWORD_RESET_MAX_FAILURES:5}
  email-find:
    # 이메일 찾기: 결과에서 비밀번호 재설정으로 넘어갈 때 쓰는 임시 토큰 10분 (D-26), 같은 IP 10분에 5번 (USR-08)
    token-ttl: ${EMAIL_FIND_TOKEN_TTL:10m}
    per-window: ${EMAIL_FIND_PER_WINDOW:5}
    window: ${EMAIL_FIND_WINDOW:10m}
  login:
    captcha-after-failures: ${LOGIN_CAPTCHA_AFTER:3}
    lock-after-failures: ${LOGIN_LOCK_AFTER:5}
    lock-duration: ${LOGIN_LOCK_DURATION:5m}
    # 같은 IP에서 계정을 바꿔 가며 틀려도 사람 확인을 띄운다. 잠금은 계정에만 건다 (D-115)
    captcha-after-ip-failures: ${LOGIN_CAPTCHA_AFTER_IP:5}
    ip-window: ${LOGIN_IP_WINDOW:1h}
  rate-limit:
    # IP별 요청 제한 (D-80). 수치는 추천안 #4 기본값, 1차는 서버 메모리에서 셈 (D-83 대기)
    login-per-minute: ${RATE_LOGIN_PER_MINUTE:20}
    mail-per-hour: ${RATE_MAIL_PER_HOUR:10}
    # 가입 화면 이메일 중복 확인 (D-99)
    email-check-per-minute: ${RATE_EMAIL_CHECK_PER_MINUTE:20}
    # 로그인한 상태에서 지금 비밀번호를 확인하는 횟수(비밀번호 변경·탈퇴, 관리자 비밀번호 변경). 회원마다 1시간에 (D-127)
    password-check-per-hour: ${RATE_PASSWORD_CHECK_PER_HOUR:10}
    # 회원 한 명이 1분에 올릴 수 있는 사진 수. 글 하나에 10장이라 넉넉히 둔다 (D-127)
    upload-per-minute: ${RATE_UPLOAD_PER_MINUTE:30}
  recaptcha:
    # Google reCAPTCHA v2 체크박스 (D-79, D-118). 기본값은 Google이 공개한 "늘 통과" 테스트 키.
    # 실제 사이트는 GitHub Actions secrets의 RECAPTCHA_SITE_KEY·RECAPTCHA_SECRET_KEY로 실제 키를 넣는다
    site-key: ${RECAPTCHA_SITE_KEY:6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI}
    secret-key: ${RECAPTCHA_SECRET_KEY:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
    verify-url: https://www.google.com/recaptcha/api/siteverify

# 블로그 (002). 개수 제한은 설정 파일 + 환경변수 (BLG-10, D-52)
blog:
  limit:
    # 공개(일부 공개 포함) 블로그 수. 5까지 올릴 수 있다 (D-51)
    public: ${BLOG_LIMIT_PUBLIC:3}
    private: ${BLOG_LIMIT_PRIVATE:5}
  # 블로그 목록 한 페이지 개수
  page-size: ${BLOG_PAGE_SIZE:12}
  # 참여 신청이 거절된 뒤 다시 신청할 수 있을 때까지 (BLG-04)
  rejoin-after-reject: ${BLOG_REJOIN_AFTER_REJECT:7d}
  # 블로그 통계 (D-112). 블로그 홈·글을 연 기록을 남겨 시간별·일별·월별 방문자와 들어온 경로를 보여 준다
  stats:
    # 방문 기록 보관 날 수. 지나면 새벽 정리 작업(app-a)이 지운다. 1년 전 같은 달과 비교할 수 있게 400일
    retention-days: ${BLOG_STATS_RETENTION_DAYS:400}
    # 같은 사람이 같은 화면을 이 시간 안에 다시 열면(새로 고침 등) 한 번으로 센다
    repeat-window: ${BLOG_STATS_REPEAT_WINDOW:30m}
    # 검색어를 저장할 때 최대 글자 수 (50까지)
    keyword-max: ${BLOG_STATS_KEYWORD_MAX:30}
    # 일별 그래프에서 한 번에 고를 수 있는 날 수
    max-day-range: ${BLOG_STATS_MAX_DAY_RANGE:92}
    # 검색어·다른 사이트·많이 본 글 목록 개수
    top-count: ${BLOG_STATS_TOP_COUNT:10}

# 사진 올리기 (004 6.3, SEC-08, D-75)
upload:
  # 1차는 서버 디스크. 이중화하면 S3로 바꾼다
  dir: ${UPLOAD_DIR:./data/uploads}
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:3MB}
  # 글 하나에 넣을 수 있는 사진 수
  max-images-per-post: ${UPLOAD_MAX_IMAGES_PER_POST:10}

# 글 속 링크 미리보기 카드 (D-92). 글을 저장할 때 서버가 한 번 받아 둔다
link-preview:
  enabled: ${LINK_PREVIEW_ENABLED:true}
  # 바깥 사이트가 늦으면 이만큼만 기다리고 카드 없이 둔다
  timeout: ${LINK_PREVIEW_TIMEOUT:3s}
  max-links-per-post: ${LINK_PREVIEW_MAX_LINKS:5}
  # 받아 둔 미리보기는 이만큼 지나면 글을 다시 저장할 때 새로 받는다 (실패한 것은 하루 뒤)
  refresh-after: ${LINK_PREVIEW_REFRESH_AFTER:7d}
  # 내부망 주소는 받지 않는다 (SSRF). 테스트에서만 켠다
  allow-private-hosts: false

# 댓글·좋아요·검색·피드 (004 4단계)
board:
  # 좋아요 연타로 알림을 쏟아내지 않도록 회원당 1분에 30번 (추천안 #11)
  reactions-per-minute: ${BOARD_REACTIONS_PER_MINUTE:30}
  comments-per-minute: ${BOARD_COMMENTS_PER_MINUTE:10}
  # 피드 인기 글: 최근 7일 안에 쓴 글 중 좋아요 많은 순 (추천안 #15)
  popular-window: ${BOARD_POPULAR_WINDOW:7d}
  recent-search-max: ${BOARD_RECENT_SEARCH_MAX:10}
  feed-notice-count: ${BOARD_FEED_NOTICE_COUNT:5}

# 팔로우·구독·차단·신고·알림 (003 5단계)
social:
  # 팔로우·구독·차단을 연타해 알림을 쏟아내지 않도록 종류별로 회원당 1분에 30번 (추천안 #11)
  actions-per-minute: ${SOCIAL_ACTIONS_PER_MINUTE:30}
  # 같은 사람이 같은 대상을 다시 신고할 수 있기까지 (SOC-06)
  report-cooldown: ${SOCIAL_REPORT_COOLDOWN:14d}
  # 알림 기본 보관 일수 (4.5). 회원·블로그장이 7일로 줄일 수 있다
  notification-retention-days: ${SOCIAL_NOTIFICATION_RETENTION_DAYS:30}
  bio-max: ${SOCIAL_BIO_MAX:150}

admin:
  # 첫 관리자 (추천안 #16, 확인 대기). 관리자가 하나도 없을 때만 이 값으로 만들고, 첫 로그인에서 비밀번호를 바꾸게 한다.
  # 값은 .env 등 환경변수로만 넣는다. 비워 두면 관리자를 만들지 않는다.
  initial-login-id: ${ADMIN_INITIAL_LOGIN_ID:}
  initial-password: ${ADMIN_INITIAL_PASSWORD:}
  # 관리자 로그인 유지 시간. 쿠키는 브라우저를 닫으면 사라진다 (SEC-09)
  session-ttl: ${ADMIN_SESSION_TTL:2h}
  # IP마다 1분에 받는 관리자 로그인 시도 수
  login-per-minute: ${ADMIN_LOGIN_PER_MINUTE:10}

# 실제 사이트에 테스트 회원과 그 활동을 넣고 지운다 (D-113). 평소에는 비어 있어 아무 일도 하지 않는다.
# .github/workflows/test-data.yml이 운영 중인 이미지로 컨테이너를 하나 더 띄워(웹 서버 없이) 이 값을 준다.
test-data:
  # load: 넣기(두 번 돌려도 더 생기지 않음), remove: 테스트 데이터만 모두 지우기
  action: ${TEST_DATA_ACTION:}
  # 테스트 회원 8명의 비밀번호. 저장소에 두지 않고 GitHub 시크릿 TEST_MEMBER_PASSWORD로만 받는다
  password: ${TEST_MEMBER_PASSWORD:}
  # 글에 넣은 영상·사이트 링크의 미리보기 카드를 바깥 사이트에서 받을지 (D-92)
  link-previews: ${TEST_DATA_LINK_PREVIEWS:true}
